[env:esp32-s3-devkitc-1-n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
; The custom partition reserves 3 MB for the application.
board_upload.maximum_size = 3145728
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCORE_DEBUG_LEVEL=3
  -DKM_RGB_PIN=48

upload_speed = 921600
monitor_speed = 115200
monitor_filters = direct
; Show typed characters immediately in PlatformIO's serial monitor.
monitor_echo = yes

lib_ldf_mode = chain
lib_compat_mode = strict
; Populated by: python3 tools/setup_tinydecide.py
lib_extra_dirs = .deps/TinyDecide/esp32

lib_deps =
  ESP32Async/AsyncTCP
  ESP32Async/ESPAsyncWebServer
  bblanchon/ArduinoJson
  adafruit/Adafruit NeoPixel
